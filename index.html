<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테트리스 - 바이브 코딩 실습</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Consolas', monospace;
      color: #e2e8f0;
    }

    .game-container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    #gameCanvas {
      border: 2px solid #334155;
      background: #0f172a;
      display: block;
    }

    .side-panel {
      width: 150px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
    }

    .panel-box h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .panel-box .value {
      font-size: 28px;
      font-weight: bold;
      color: #e2e8f0;
    }

    #overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 16px;
      font-size: 24px;
      color: #f1f5f9;
    }

    #overlay.show { display: flex; }

    #restartBtn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Consolas', monospace;
    }
    #restartBtn:hover { background: #2563eb; }

    .canvas-wrapper {
      position: relative;
    }

    .controls {
      font-size: 12px;
      color: #475569;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="300" height="600"></canvas>
    <div id="overlay">
      <div>GAME OVER</div>
      <button id="restartBtn">다시 시작</button>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-box">
      <h3>점수</h3>
      <div class="value" id="scoreDisplay">0</div>
    </div>
    <div class="panel-box">
      <h3>레벨</h3>
      <div class="value" id="levelDisplay">1</div>
    </div>
    <div class="panel-box">
      <h3>라인</h3>
      <div class="value" id="linesDisplay">0</div>
    </div>
    <div class="panel-box controls">
      <h3>조작법</h3>
      ← → 이동<br>
      ↑ 회전<br>
      ↓ 빠르게<br>
    </div>
  </div>
</div>

<script>
// ============================================================
//  ■ 상수 정의
// ============================================================
const COLS       = 10;
const ROWS       = 20;
const BLOCK_SIZE = 30;

const SHAPES = {
  I: [[1, 1, 1, 1]],
  O: [[1, 1],
      [1, 1]],
  T: [[0, 1, 0],
      [1, 1, 1]],
  S: [[0, 1, 1],
      [1, 1, 0]],
  Z: [[1, 1, 0],
      [0, 1, 1]],
  L: [[1, 0],
      [1, 0],
      [1, 1]],
  J: [[0, 1],
      [0, 1],
      [1, 1]],
};

const COLORS = {
  I: '#00f0f0',
  O: '#f0f000',
  T: '#a000f0',
  S: '#00f000',
  Z: '#f00000',
  L: '#f0a000',
  J: '#0000f0',
};

const PIECE_TYPES = Object.keys(SHAPES); // ['I','O','T','S','Z','L','J']

// ============================================================
//  ■ 캔버스 초기화
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// ============================================================
//  ■ 게임 상태 변수
// ============================================================
let board        = [];
let currentPiece = null;
let score        = 0;
let level        = 1;
let linesCleared = 0;
let gameOver     = false;
let lastTime     = 0;
let dropInterval = 1000;

// ============================================================
//  ■ 단일 블록 그리기 헬퍼
// ============================================================
function drawBlock(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(
    x * BLOCK_SIZE,
    y * BLOCK_SIZE,
    BLOCK_SIZE - 1,
    BLOCK_SIZE - 1
  );
  // 하이라이트 (윗면 밝게)
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, 4);
}

// ============================================================
//  ① initBoard() — 보드 초기화
//  ROWS × COLS 크기의 2D 배열을 생성하고 모든 칸을 null로 채움
// ============================================================
function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    // 각 행을 독립 배열로 생성 — fill()만 쓰면 참조 공유 버그 발생
    board.push(new Array(COLS).fill(null));
  }
}

// ============================================================
//  ② createPiece() — 새 블록 생성
//  PIECE_TYPES 중 랜덤 1개 선택, x=중앙, y=0으로 currentPiece 할당
// ============================================================
function createPiece() {
  // 무작위 타입 키 선택
  const type  = PIECE_TYPES[Math.floor(Math.random() * PIECE_TYPES.length)];
  const shape = SHAPES[type];
  const color = COLORS[type];

  currentPiece = {
    shape,
    color,
    // 블록 가로 폭 기준 수평 중앙 계산
    x: Math.floor((COLS - shape[0].length) / 2),
    y: 0,
  };
}

// ============================================================
//  ③ isCollision(piece, dx, dy) — 충돌 감지
//  ① 왼쪽·오른쪽 벽  ② 바닥  ③ 고정 블록
// ============================================================
function isCollision(piece, dx, dy) {
  const { shape, x, y } = piece;

  for (let row = 0; row < shape.length; row++) {
    for (let col = 0; col < shape[row].length; col++) {
      // 빈 셀(0)은 검사 제외
      if (!shape[row][col]) continue;

      const nextX = x + col + dx;
      const nextY = y + row + dy;

      // ① 벽 충돌
      if (nextX < 0 || nextX >= COLS) return true;
      // ② 바닥 충돌
      if (nextY >= ROWS) return true;
      // 스폰 직후 음수 y는 충돌 제외
      if (nextY < 0) continue;
      // ③ 고정 블록 충돌
      if (board[nextY][nextX] !== null) return true;
    }
  }
  return false;
}

// ============================================================
//  ④ rotate(shape) — 90도 시계방향 회전
//  변환 공식: rotated[c][rows-1-r] = shape[r][c]
// ============================================================
function rotate(shape) {
  const rows = shape.length;
  const cols = shape[0].length;

  // 회전 후 크기: cols행 × rows열
  const rotated = Array.from({ length: cols }, () => new Array(rows).fill(0));

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      rotated[c][rows - 1 - r] = shape[r][c];
    }
  }
  return rotated;
}

// ============================================================
//  ⑤ placePiece() — 현재 블록을 보드에 고정
//  shape의 값이 1인 칸을 board에 색상 문자열로 기록
// ============================================================
function placePiece() {
  const { shape, color, x, y } = currentPiece;

  for (let row = 0; row < shape.length; row++) {
    for (let col = 0; col < shape[row].length; col++) {
      if (!shape[row][col]) continue;
      // 보드 해당 칸에 색상 저장 (null → 색상 문자열)
      board[y + row][x + col] = color;
    }
  }
}

// ============================================================
//  ⑥ clearLines() — 완성된 행 제거 및 점수 계산
//  가득 찬 행을 제거하고 위 행들을 아래로 내림
// ============================================================
function clearLines() {
  // 점수 테이블: 1줄=100, 2줄=300, 3줄=500, 4줄=800
  const points = [0, 100, 300, 500, 800];
  let count = 0; // 이번에 제거한 줄 수

  for (let r = ROWS - 1; r >= 0; r--) {
    // 해당 행의 모든 칸이 null이 아닌지 확인
    const isFull = board[r].every(cell => cell !== null);

    if (isFull) {
      board.splice(r, 1);               // 가득 찬 행 제거
      board.unshift(new Array(COLS).fill(null)); // 맨 위에 빈 행 추가
      count++;
      r++; // 행을 제거했으므로 같은 인덱스 재검사
    }
  }

  if (count > 0) {
    // 점수 누적 (레벨 보정 적용)
    score += points[count] * level;
    // 총 제거 라인 수 갱신
    linesCleared += count;
    // 10줄마다 레벨 업
    level = Math.floor(linesCleared / 10) + 1;
    // 레벨에 따라 낙하 속도 증가 (최소 100ms)
    dropInterval = Math.max(100, 1000 - (level - 1) * 100);
  }
}

// ============================================================
//  ⑦ draw() — 매 프레임 화면 렌더링
//  ① 배경·격자  ② 고정 블록  ③ 현재 낙하 블록
// ============================================================
function draw() {
  // ① 배경 지우기
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 격자 선 (옅게)
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 0.5;
  for (let c = 0; c < COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(c * BLOCK_SIZE, 0);
    ctx.lineTo(c * BLOCK_SIZE, canvas.height);
    ctx.stroke();
  }
  for (let r = 0; r < ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(0, r * BLOCK_SIZE);
    ctx.lineTo(canvas.width, r * BLOCK_SIZE);
    ctx.stroke();
  }

  // ② board 고정 블록 그리기
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c]) {
        drawBlock(c, r, board[r][c]);
      }
    }
  }

  // ③ currentPiece 낙하 블록 그리기
  if (currentPiece) {
    const { shape, color, x, y } = currentPiece;
    for (let row = 0; row < shape.length; row++) {
      for (let col = 0; col < shape[row].length; col++) {
        if (shape[row][col]) {
          drawBlock(x + col, y + row, color);
        }
      }
    }
  }
}

// ============================================================
//  ⑧ keydown 핸들러 — 키보드 입력 처리
// ============================================================
document.addEventListener('keydown', (e) => {
  if (gameOver) return;
  if (!currentPiece) return;

  switch (e.key) {
    // ← 왼쪽 이동
    case 'ArrowLeft':
      if (!isCollision(currentPiece, -1, 0)) {
        currentPiece.x -= 1;
      }
      break;

    // → 오른쪽 이동
    case 'ArrowRight':
      if (!isCollision(currentPiece, 1, 0)) {
        currentPiece.x += 1;
      }
      break;

    // ↓ 빠른 하강
    case 'ArrowDown':
      if (!isCollision(currentPiece, 0, 1)) {
        currentPiece.y += 1;
      } else {
        // 바닥·블록에 닿았으면 즉시 고정
        placePiece();
        clearLines();
        updateUI();
        createPiece();
        // 새 블록 스폰 즉시 충돌 → 게임 오버
        if (isCollision(currentPiece, 0, 0)) {
          gameOver = true;
          showGameOver();
        }
      }
      break;

    // ↑ 시계방향 회전
    case 'ArrowUp': {
      const rotatedShape = rotate(currentPiece.shape);
      // 임시 객체로 충돌 검사 후 교체 여부 결정
      const testPiece = { ...currentPiece, shape: rotatedShape };
      if (!isCollision(testPiece, 0, 0)) {
        currentPiece.shape = rotatedShape; // 충돌 없음 → 회전 확정
      }
      // 충돌 있음 → 기존 shape 유지 (아무것도 안 함)
      break;
    }
  }

  draw(); // 입력 즉시 화면 갱신
});

// ============================================================
//  ⑨ gameLoop(timestamp) — 메인 게임 루프
//  dropInterval마다 자동 하강, 게임 오버 감지
// ============================================================
function gameLoop(timestamp) {
  // 게임 오버면 루프 종료
  if (gameOver) return;

  const deltaTime = timestamp - lastTime;

  // dropInterval 경과 시 블록 자동 하강
  if (deltaTime > dropInterval) {

    if (!isCollision(currentPiece, 0, 1)) {
      // 아래 공간 있음 → 자연 낙하
      currentPiece.y += 1;
    } else {
      // 바닥·블록에 닿음 → 고정 처리
      placePiece();
      clearLines();
      updateUI();
      createPiece();

      // 새 블록 스폰 즉시 충돌 → 보드 가득 참 = 게임 오버
      if (isCollision(currentPiece, 0, 0)) {
        gameOver = true;
        showGameOver();
        return;
      }
    }

    lastTime = timestamp; // 기준 시간 갱신
  }

  draw();
  requestAnimationFrame(gameLoop);
}

// ============================================================
//  ■ UI 업데이트 헬퍼
// ============================================================
function updateUI() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('levelDisplay').textContent = level;
  document.getElementById('linesDisplay').textContent = linesCleared;
}

// ============================================================
//  ■ 게임 시작 / 재시작
// ============================================================
function startGame() {
  initBoard();
  score        = 0;
  level        = 1;
  linesCleared = 0;
  gameOver     = false;
  dropInterval = 1000;
  lastTime     = 0;

  createPiece();
  updateUI();

  document.getElementById('overlay').classList.remove('show');
  requestAnimationFrame(gameLoop);
}

function showGameOver() {
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('restartBtn').addEventListener('click', startGame);

// 게임 시작!
startGame();
</script>
</body>
</html>
